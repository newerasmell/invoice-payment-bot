  /v1/rates:
    get:
      tags:
        - 'Exchange Rates'
      summary: 'Get Exchange Rates'
      description: "Get exchange rates. When both 'from' and 'to' are omitted, returns all rates (by account and currency pairs). When 'from' and 'to' are provided, returns rate(s) for that pair. Optional 'account' filters by account number."
      operationId: 554cf7200983aea1f32446aa0257bd26
      parameters:
        -
          name: account
          in: query
          description: 'Rates for Specific Account.(optional)'
          required: false
          schema:
            type: integer
          examples:
            int:
              summary: 'An int value.'
              value: '41411111111'
        -
          name: from
          in: query
          description: "Currency to convert from (e.g. USD, EUR, GBP). Omit with 'to' to get all rates."
          required: false
          schema:
            type: string
          examples:
            string:
              summary: 'A string value.'
              value: USD
        -
          name: to
          in: query
          description: "Currency to convert to. Omit with 'from' to get all rates. When provided, 'from' must also be provided and must differ from 'to'."
          required: false
          schema:
            type: string
          examples:
            string:
              summary: 'A string value.'
              value: EUR
        -
          name: page
          in: query
          description: 'Page number'
          required: false
          schema:
            type: integer
          examples:
            int:
              summary: 'An int value.'
              value: '1'
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                properties:
                  status:
                    type: string
                    example: success
                  rates:
                    $ref: '#/components/schemas/rates'
                  pagination:
                    $ref: '#/components/schemas/pagination'
                type: object
        400:
          description: Error
          content:
            application/json:
              schema:
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    properties:
                      exchange-rates:
                        type: string
                    type: object
                type: object
        401:
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unauthenticated'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unauthorized'
        502:
          description: 'Upstream service unavailable'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/badGateway'
      x-codeSamples:
        -
          lang: PHP
          source: "// Get All Exchange Rates\n$ch = curl_init();\n\ncurl_setopt($ch, CURLOPT_URL, 'https://api.paynetics.online/v1/rates');\ncurl_setopt($ch, CURLOPT_HTTPHEADER, array(\n    'Access-Token: <your-api-token>',\n    'Secret-Key: <your-api-secret>',\n));\n\ncurl_setopt($ch, CURLOPT_RETURNTRANSFER, 1);\n\n$output = curl_exec($ch);\n\ncurl_close($ch);\n\n\n// Get Specific Exchange Rate\n$ch = curl_init();\n\n$params = array(\n    'account'   => '41411111111',\n    'from'  => 'USD',\n    'to'    => 'EUR'\n);\n\ncurl_setopt($ch, CURLOPT_URL, 'https://api.paynetics.online/v1/rates?' . http_build_query($params));\ncurl_setopt($ch, CURLOPT_HTTPHEADER, array(\n    'Access-Token: <your-api-token>',\n    'Secret-Key: <your-api-secret>',\n));\n\ncurl_setopt($ch, CURLOPT_RETURNTRANSFER, 1);\n\n$output = curl_exec($ch);\n\ncurl_close($ch);"
