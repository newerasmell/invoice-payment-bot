openapi: 3.0.0
info:
  title: Paynetics
  description: '<div>This is the official API documentation of Paynetics.</div>'
  termsOfService: 'https://paynetics.online/pages/terms-of-service'
  contact:
    name: 'API Support'
    url: 'https://paynetics.online/pages/contact-us/customer-support'
    email: support@paynetics.online
  license:
    name: MIT
    url: 'https://opensource.org/licenses/MIT'
  version: 1.2.0
  x-logo:
    url: 'https://paynetics.online/assets/paynetics/images/logo_light.png'
    altText: 'Paynetics Logo'
servers:
  -
    url: 'https://api.paynetics.online'
    description: 'API Documentation'
paths:
  '/v1/accounts/{account}':
    get:
      tags:
        - Accounts
      summary: 'Get Account(s) Balance'
      description: 'Get account balance for all accounts or specific account'
      operationId: 7d472acd7e8cb613c34a0bc721b6b6b1
      parameters:
        -
          name: account
          in: path
          description: 'Account Balance for Specific Account'
          allowEmptyValue: true
          schema:
            type: integer
          examples:
            int:
              summary: 'An int value.'
              value: '41411111111'
        -
          name: page
          in: query
          description: 'Page number'
          required: false
          schema:
            type: integer
          examples:
            int:
              summary: 'An int value.'
              value: '1'
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                properties:
                  status:
                    type: string
                  data:
                    properties:
                      account:
                        $ref: '#/components/schemas/account'
                    type: object
                  pagination:
                    $ref: '#/components/schemas/pagination'
                type: object
        400:
          description: Error
          content:
            application/json:
              schema:
                properties:
                  status:
                    type: string
                  message:
                    properties:
                      account-balance:
                        type: string
                    type: object
                type: object
        401:
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unauthenticated'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unauthorized'
        502:
          description: 'Upstream service unavailable'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/badGateway'
      x-codeSamples:
        -
          lang: PHP
          source: "// Get all Accounts Balance\n$ch = curl_init();\n\ncurl_setopt($ch, CURLOPT_URL, 'https://api.paynetics.online/v1/accounts');\ncurl_setopt($ch, CURLOPT_HTTPHEADER, array(\n    'Access-Token: <your-api-token>',\n    'Secret-Key: <your-api-secret>',\n));\n\ncurl_setopt($ch, CURLOPT_RETURNTRANSFER, 1);\n\n$output = curl_exec($ch);\n\ncurl_close($ch);\n\n\n// Get Specific Account Balance\n$ch = curl_init();\n\ncurl_setopt($ch, CURLOPT_URL, 'https://api.paynetics.online/v1/accounts/41411111111');\ncurl_setopt($ch, CURLOPT_HTTPHEADER, array(\n    'Access-Token: <your-api-token>',\n    'Secret-Key: <your-api-secret>',\n));\n\ncurl_setopt($ch, CURLOPT_RETURNTRANSFER, 1);\n\n$output = curl_exec($ch);\n\ncurl_close($ch);"
  /v1/register:
    post:
      tags:
        - Registration
      summary: 'Create New Business Profile'
      description: 'Create a new business profile so you can start using Paynetics services'
      operationId: 1035296de276cfc62c56dae0493020d8
      parameters:
        -
          name: type
          in: query
          description: 'Account Type'
          required: true
          schema:
            type: string
            enum:
              - business
          examples:
            string:
              summary: 'A string value.'
              value: business
        -
          name: firstname
          in: query
          description: 'First Name of the Account User'
          required: true
          schema:
            type: string
          examples:
            string:
              summary: 'A string value.'
              value: John
        -
          name: lastname
          in: query
          description: 'Last Name of the Account User'
          required: true
          schema:
            type: string
          examples:
            string:
              summary: 'A string value.'
              value: Smith
        -
          name: email
          in: query
          description: 'Email Address of the Account User'
          required: true
          schema:
            type: string
          examples:
            string:
              summary: 'A string value.'
              value: john@example.com
        -
          name: country
          in: query
          description: 'Country of Residence of the Account User (ISO 3166-1 alpha-3 country code)'
          required: true
          schema:
            type: string
          examples:
            string:
              summary: 'A string value.'
              value: GBR
        -
          name: county
          in: query
          description: 'County of Residence of the Account User'
          required: true
          schema:
            type: string
          examples:
            string:
              summary: 'A string value.'
              value: 'Greater London'
        -
          name: city
          in: query
          description: 'City of Residence of the Account User'
          required: true
          schema:
            type: string
          examples:
            string:
              summary: 'A string value.'
              value: London
        -
          name: address
          in: query
          description: 'Address of Residence of the Account User'
          required: true
          schema:
            type: string
          examples:
            string:
              summary: 'A string value.'
              value: Address
        -
          name: zip
          in: query
          description: 'Zip Code of Residence of the Account User'
          required: true
