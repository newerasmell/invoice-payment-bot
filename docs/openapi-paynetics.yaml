  -
    name: Authentication
    description: "## Overview\n\nPaynetics uses a **two-header API key** authentication scheme — no OAuth, no Bearer tokens, no sessions. Every request to the API must include both of the following HTTP headers:\n\n| Header | Description |\n|--------|-------------|\n| Access-Token | Your unique API token identifier |\n| Secret-Key | Your API secret (shown only once at creation) |\n\n**Base URL for all API requests:**\n\nhttps://api.paynetics.online/v1\n\n---\n\n## Prerequisites\n\nBefore you can obtain API credentials, all three of the following must be in place:\n\n1. **Registered business account** — <a href=\"https://paynetics.online\" target=\"_blank\" rel=\"noopener noreferrer\">Sign up at Paynetics</a>\n2. **KYC onboarding completed** — your business account must have status *approved*. KYC approval is handled during onboarding; contact [support@paynetics.online](mailto:support@paynetics.online) if your account is pending.\n3. **Logged in as a master user** — only the *master user* of a business account can view and manage API tokens. Sub-users and team members do not have access to the API Tokens tab.\n\n---\n\n## Step-by-step: getting your credentials\n\n1. Log in to your client panel at <a href=\"https://paynetics.online/profile/api\" target=\"_blank\" rel=\"noopener noreferrer\">https://paynetics.online/profile/api</a>.\n\n2. In the top navigation, click your account menu and select **Settings**.\n3. In the Settings tabs, click **API Tokens**.\n   > ⚠️ This tab is visible **only** to master users of business accounts. If you do not see it, verify you are logged in as the master user.\n4. Click **Create New API Token**.\n5. Fill in the form:\n   - **API Token Name** — a descriptive label for this credential set (e.g. \\`Production integration\\`, \\`Staging tests\\`). Used for identification only.\n   - **Webhook URL** *(optional)* — an HTTPS endpoint that will receive webhook events (transfer status changes, Sumsub KYC updates). You can leave this blank and add it later.\n6. Click **Create**.\n7. The confirmation screen shows your **Access-Token** and **Secret-Key**.\n\n> ⚠️ **Copy your Secret-Key immediately.** It is shown **only once**. Our server stores it as a one-way hash and it cannot be retrieved later. If you lose it, you must revoke this token and create a new one.\n\n---\n\n## Using your credentials in API requests\n\nThe labels in the client panel match the HTTP header names exactly. \nCopy each value from <a href=\"https://paynetics.online/profile/api\" target=\"_blank\" rel=\"noopener noreferrer\">Settings → API Tokens</a> and send it using the same name:\n\n| Client panel label | HTTP header (same name) |\n|--------------------|-------------------------|\n| **Access-Token** | Access-Token |\n| **Secret-Key** | Secret-Key |\n\n> Do **not** use \\`API-Token\\`, \\`Authorization: Bearer\\`, or any other header name — these will all result in \\`401 Unauthorized\\`.\n\n---\n\n## Making your first authenticated request\n\nUse the \\`/v1/profile\\` endpoint to verify your credentials. A successful \\`200 OK\\` response confirms your headers are correct.\n\n**cURL:**\n\n<pre style=\"text-shadow: none; margin: 10px 0;\"><code class=\"language-bash\" style=\"text-shadow: none;\">curl https://api.paynetics.online/v1/profile \\\n  -H \"Access-Token: &lt;your-access-token&gt;\" \\\n  -H \"Secret-Key: &lt;your-secret-key&gt;\"</code></pre>\n\n**PHP (cURL extension):**\n\n<pre style=\"text-shadow: none; margin: 10px 0;\"><code class=\"language-php\" style=\"text-shadow: none;\">$ch = curl_init();\ncurl_setopt($ch, CURLOPT_URL, 'https://api.paynetics.online/v1/profile');\ncurl_setopt($ch, CURLOPT_HTTPHEADER, [\n    'Access-Token: &lt;your-access-token&gt;',\n    'Secret-Key: &lt;your-secret-key&gt;',\n]);\ncurl_setopt($ch, CURLOPT_RETURNTRANSFER, 1);\n$response = curl_exec($ch);\ncurl_close($ch);</code></pre>\n\nA successful response returns \\`HTTP 200\\` with a JSON body containing your account profile. See the **Profile** endpoint in the sidebar for the full response schema.\n\n---\n\n## Troubleshooting authentication errors\n\nAll authentication failures return \\`HTTP 401 Unauthorized\\`. The response body does not include a specific error reason. Use this table to diagnose the cause:\n\n| Cause | How to resolve |\n|-------|----------------|\n| **Header name misspelled** (e.g. sent \\`API-Token\\` instead of \\`Access-Token\\`) | Use exact spelling: \\`Access-Token\\` and \\`Secret-Key\\` — the same names shown in the client panel. |\n| **Headers missing entirely** | Both \\`Access-Token\\` and \\`Secret-Key\\` must be present on every request. |\n| **Access-Token value not recognised** | Re-copy the value from the client panel (Settings → API Tokens). It is 64 characters with no leading or trailing whitespace. |\n| **Secret-Key does not match the token** | Verify you are pairing the secret with its corresponding token (match by token name). If you have lost the secret, revoke the token and create a new one. |\n| **Token has been revoked** | Create a new token in Settings → API Tokens. |\n| **Owner master user is not KYC-approved** | Complete KYC verification in the client panel and retry. |\n| **Business account status is not approved** | Wait for onboarding completion or contact [support@paynetics.online](mailto:support@paynetics.online). |\n\n---\n\n## Managing tokens (revoke, rotate, multiple tokens)\n\n**View existing tokens**\n\nLog in to the <a href=\"https://paynetics.online/profile/api\" target=\"_blank\" rel=\"noopener noreferrer\">client panel</a> and open **Settings → API Tokens**. The list shows all active tokens with their names, creation dates, and webhook URLs.\n\n\n**Revoke a token**\n\nIn the API Tokens list, find the token you want to disable and click the **Revoke** button in the Actions column. Revoked tokens immediately return \\`401\\` on all subsequent requests.\n\n**Rotate credentials (recommended practice)**\n\nThere is no in-place secret regeneration. To rotate:\n\n1. Create a **new** token in Settings → API Tokens.\n2. Update your integration to use the new \\`Access-Token\\` and \\`Secret-Key\\`.\n3. Verify the new credentials work (make a test request to \\`/v1/profile\\`).\n4. Revoke the **old** token.\n\n**Use multiple tokens**\n\nYou can create as many tokens as you need. Recommended:\n\n- Separate tokens for **production** and **staging** environments.\n- Separate tokens per server, service, or team — easier to revoke a single credential without impacting other systems if a secret is compromised.\n\n---\n\n## Best practices and security\n\n- **Protect your Secret Key** — store it in a secrets manager, environment variable, or vault. Never commit it to source control, even in a \\`.env\\` file tracked by git.\n- **HTTPS only** — all requests must use HTTPS. Plain HTTP requests are rejected.\n- **Use separate credential pairs** for staging and production to limit blast radius on credential compromise.\n- **Rotate proactively on suspected exposure**: create a new pair → switch your integration → revoke the old pair.\n- **Webhooks** — if you set a Webhook URL on a token, your endpoint must respond with \\`HTTP 200\\` to every incoming \\`POST\\`. Events that do not receive a \\`200\\` are retried once. See the **Webhooks** section in the sidebar.\n- **Do not share credentials** between different systems or people — create separate tokens with descriptive names for easier audit and revocation."
