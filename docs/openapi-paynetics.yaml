          source: "// Create Business Account\n$registerData = array (\n\n    'type'                 => 'business',\n    'firstname'             => 'John',\n    'lastname'              => 'Smith',\n    'email'                 => 'john@example.com',\n    'country'               => 'GBR',\n    'county'                => 'Greater London',\n    'city'                  => 'London',\n    'address'               => 'Address',\n    'zip'                   => '1000',\n    'phone'                 => '+1234567890',\n    'occupation'            => 'Occupation unknown',\n    'agree'                 => true,\n    'subscribed'            => 0,\n    'pep'                   => 'N',\n\n    // If main user is director\n    'is_director' => true,\n\n    // If main user is owner\n    'is_owner' => true,\n\n    // Business Account Parameters\n    'name'                 => 'Company Name',\n    'trade_name'           => 'Trade Name',\n    'registration_id'      => 123456789,\n    'tax_id'               => 123456789,\n    'registration_date'    => '2022-10-01',\n    'registered_country'   => 'GBR',\n    'registered_city'      => 'London',\n    'registered_address'   => 'Address',\n    'registered_zip'       => '1000',\n    'registered_county'    => 'Greater London',\n    'website'              => 'https://example.com',\n    'range'                => 'Marketing services',\n    'industry'             => 'Services and related services',\n    'company_type'         => 'LTD',\n\n    // Directors Parameters\n    'directors' => array (\n        array (\n            'firstname' => 'John',\n            'lastname'  => 'Smith',\n            'email'     => 'john@example.com',\n            'address'   => 'Address',\n            'phone'     => '+1234567890',\n            'zip'       => '1000',\n            'city'      => 'London',\n            'county'    => 'Greater London',\n            'country'   => 'GBR',\n            'pep'       => 'N'\n        )\n    ),\n\n    // Owners Parameters\n    'owners' => array (\n        array (\n            'firstname' => 'John',\n            'lastname'  => 'Smith',\n            'email'     => 'john@example.com',\n            'address'   => 'Address',\n            'phone'     => '+1234567890',\n            'zip'       => '1000',\n            'city'      => 'London',\n            'county'    => 'Greater London',\n            'country'   => 'GBR',\n            'share'     => 100,\n            'pep'       => 'N'\n        )\n    )\n\n);\n\n$ch = curl_init();\n\ncurl_setopt($ch, CURLOPT_URL, 'https://api.paynetics.online/v1/register');\ncurl_setopt($ch, CURLOPT_HTTPHEADER, array(\n    'Access-Token: <your-api-token>',\n    'Secret-Key: <your-api-secret>',\n));\n\ncurl_setopt($ch, CURLOPT_RETURNTRANSFER, 1);\ncurl_setopt($ch, CURLOPT_POST, 1);\ncurl_setopt($ch, CURLOPT_POSTFIELDS, $registerData);\n\n$output = curl_exec($ch);\n\ncurl_close($ch);"
